<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Provider evidence ladder</title>
  <desc id="desc">Four ascending cards move from a spoken claim to a relevant example, written scope and acceptance check.</desc>
  <rect width="1200" height="680" rx="24" fill="#f4f0e6"/>
  <text x="70" y="82" fill="#171c28" font-family="Manrope, sans-serif" font-size="38" font-weight="700">Move every claim toward a check</text>
  <text x="70" y="122" fill="#596173" font-family="Manrope, sans-serif" font-size="20">Confidence is useful when the buyer can inspect what it means.</text>
  <g font-family="Manrope, sans-serif">
    <path d="M116 518L1080 206" fill="none" stroke="#c9c4b8" stroke-width="8" stroke-linecap="round"/>
    <g transform="translate(70 398)">
      <rect width="240" height="150" rx="20" fill="#ffffff" stroke="#d9d3c7" stroke-width="3"/>
      <text x="28" y="44" fill="#244cff" font-size="18" font-weight="700">01</text>
      <text x="28" y="82" fill="#171c28" font-size="25" font-weight="700">Clear claim</text>
      <text x="28" y="116" fill="#596173" font-size="17">What is being offered?</text>
    </g>
    <g transform="translate(338 320)">
      <rect width="240" height="150" rx="20" fill="#171c28"/>
      <text x="28" y="44" fill="#ff8659" font-size="18" font-weight="700">02</text>
      <text x="28" y="82" fill="#ffffff" font-size="25" font-weight="700">Relevant evidence</text>
      <text x="28" y="116" fill="#d7d9df" font-size="17">What can be inspected?</text>
    </g>
    <g transform="translate(606 242)">
      <rect width="240" height="150" rx="20" fill="#244cff"/>
      <text x="28" y="44" fill="#ffffff" font-size="18" font-weight="700">03</text>
      <text x="28" y="82" fill="#ffffff" font-size="25" font-weight="700">Written scope</text>
      <text x="28" y="116" fill="#e4e9ff" font-size="17">Where is the boundary?</text>
    </g>
    <g transform="translate(874 164)">
      <rect width="240" height="150" rx="20" fill="#ffffff" stroke="#ff694f" stroke-width="4"/>
      <text x="28" y="44" fill="#ad2f1b" font-size="18" font-weight="700">04</text>
      <text x="28" y="82" fill="#171c28" font-size="25" font-weight="700">Acceptance check</text>
      <text x="28" y="116" fill="#596173" font-size="17">How will completion be verified?</text>
    </g>
  </g>
</svg>

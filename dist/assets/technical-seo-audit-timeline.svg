<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Technical SEO audit timeline stages</title>
  <desc id="desc">Five connected stages separate scope, evidence, actionable findings, implementation and live verification.</desc>
  <rect width="1200" height="680" rx="28" fill="#e8edff"/>
  <path d="M112 340h976" stroke="#244cff" stroke-width="8" stroke-linecap="round" stroke-dasharray="3 25"/>
  <g font-family="Arial, sans-serif" fill="#171c28">
    <g transform="translate(50 188)"><rect width="200" height="304" rx="22" fill="#f7f5ef"/><text x="24" y="48" font-size="15" font-weight="700" letter-spacing="2">01 / SCOPE</text><text x="24" y="108" font-size="28" font-weight="700">Name the</text><text x="24" y="143" font-size="28" font-weight="700">question.</text><text x="24" y="205" font-size="16">Coverage, access,</text><text x="24" y="232" font-size="16">exclusions and</text><text x="24" y="259" font-size="16">decision owner.</text></g>
    <g transform="translate(275 135)"><rect width="200" height="410" rx="22" fill="#fff"/><text x="24" y="48" font-size="15" font-weight="700" letter-spacing="2">02 / EVIDENCE</text><text x="24" y="108" font-size="28" font-weight="700">Inspect and</text><text x="24" y="143" font-size="28" font-weight="700">reproduce.</text><text x="24" y="205" font-size="16">Crawl, templates,</text><text x="24" y="232" font-size="16">search evidence and</text><text x="24" y="259" font-size="16">manual validation.</text><circle cx="100" cy="337" r="42" fill="#ff8659"/><path d="M82 337h36m-12-12 12 12-12 12" fill="none" stroke="#171c28" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(500 105)"><rect width="200" height="470" rx="22" fill="#244cff"/><text x="24" y="48" font-size="15" font-weight="700" letter-spacing="2" fill="#fff">03 / HANDOFF</text><text x="24" y="108" font-size="28" font-weight="700" fill="#fff">Make findings</text><text x="24" y="143" font-size="28" font-weight="700" fill="#fff">actionable.</text><text x="24" y="205" font-size="16" fill="#fff">Evidence, examples,</text><text x="24" y="232" font-size="16" fill="#fff">owner, priority and</text><text x="24" y="259" font-size="16" fill="#fff">acceptance check.</text><text x="24" y="394" font-size="14" fill="#fff">AUDIT MILESTONE</text></g>
    <g transform="translate(725 155)"><rect width="200" height="370" rx="22" fill="#fff"/><text x="24" y="48" font-size="15" font-weight="700" letter-spacing="2">04 / RELEASE</text><text x="24" y="108" font-size="28" font-weight="700">Implement the</text><text x="24" y="143" font-size="28" font-weight="700">accepted work.</text><text x="24" y="205" font-size="16">Controlled changes,</text><text x="24" y="232" font-size="16">deployment record</text><text x="24" y="259" font-size="16">and immediate tests.</text></g>
    <g transform="translate(950 188)"><rect width="200" height="304" rx="22" fill="#10182d"/><text x="24" y="48" font-size="15" font-weight="700" letter-spacing="2" fill="#fff">05 / VERIFY</text><text x="24" y="108" font-size="28" font-weight="700" fill="#fff">Check live</text><text x="24" y="143" font-size="28" font-weight="700" fill="#fff">conditions.</text><text x="24" y="205" font-size="16" fill="#fff">Technical checks now;</text><text x="24" y="232" font-size="16" fill="#fff">search observations</text><text x="24" y="259" font-size="16" fill="#fff">after complete data.</text></g>
    <text x="50" y="632" font-size="16" letter-spacing="1.5">ORIGINAL SITESUTRA DECISION DIAGRAM · AUDIT DELIVERY IS NOT A RANKING DEADLINE</text>
  </g>
</svg>

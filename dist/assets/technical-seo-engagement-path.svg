<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Technical SEO engagement decision path</title>
  <desc id="desc">A flow from observed evidence to three engagement choices: audit for unclear causes, implementation for accepted findings, and consultancy for recurring decisions, all ending in verification.</desc>
  <rect width="1200" height="650" rx="36" fill="#f7f5ef"/>
  <path d="M135 326H1065" stroke="#171c28" stroke-width="4" stroke-linecap="round"/>
  <circle cx="145" cy="326" r="56" fill="#244cff"/>
  <text x="145" y="319" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">OBSERVE</text>
  <text x="145" y="342" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#fff">evidence</text>
  <path d="M280 326V145H458" fill="none" stroke="#244cff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M280 326H458" fill="none" stroke="#e5613b" stroke-width="4" stroke-linecap="round"/>
  <path d="M280 326V507H458" fill="none" stroke="#171c28" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="458" y="85" width="300" height="120" rx="20" fill="#244cff"/>
  <text x="488" y="128" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">CAUSE UNCLEAR</text>
  <text x="488" y="160" font-family="Georgia,serif" font-size="28" fill="#fff">Audit</text>
  <text x="488" y="184" font-family="Arial,sans-serif" font-size="14" fill="#fff">diagnose and prioritise</text>
  <rect x="458" y="266" width="300" height="120" rx="20" fill="#fff" stroke="#e5613b" stroke-width="4"/>
  <text x="488" y="309" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#171c28">FINDINGS ACCEPTED</text>
  <text x="488" y="341" font-family="Georgia,serif" font-size="28" fill="#171c28">Fix sprint</text>
  <text x="488" y="365" font-family="Arial,sans-serif" font-size="14" fill="#171c28">implement and release</text>
  <rect x="458" y="447" width="300" height="120" rx="20" fill="#171c28"/>
  <text x="488" y="490" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">DECISIONS RECUR</text>
  <text x="488" y="522" font-family="Georgia,serif" font-size="28" fill="#fff">Consultancy</text>
  <text x="488" y="546" font-family="Arial,sans-serif" font-size="14" fill="#fff">review releases and advise</text>
  <path d="M758 145H900V326" fill="none" stroke="#244cff" stroke-width="4"/>
  <path d="M758 326H900" fill="none" stroke="#e5613b" stroke-width="4"/>
  <path d="M758 507H900V326" fill="none" stroke="#171c28" stroke-width="4"/>
  <circle cx="1000" cy="326" r="72" fill="#e5613b"/>
  <text x="1000" y="319" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">VERIFY</text>
  <text x="1000" y="344" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#fff">record limits</text>
  <text x="70" y="610" font-family="Arial,sans-serif" font-size="13" letter-spacing="2" fill="#171c28">CHOOSE FROM THE BLOCKED DECISION · DEFINE OWNER · TEST THE AGREED CONDITION</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">A trustworthy link starts with a useful reason to reference a page</title>
  <desc id="desc">Four connected stages show a real audience question, a useful owned resource, relevant outreach and an editorially chosen reference.</desc>
  <rect width="1200" height="680" rx="28" fill="#e8edff"/>
  <path d="M118 340h964" stroke="#244cff" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 25"/>
  <g font-family="Arial, sans-serif" fill="#171c28">
    <g transform="translate(70 175)"><rect width="235" height="330" rx="22" fill="#f7f5ef"/><text x="28" y="52" font-size="16" font-weight="700" letter-spacing="2">01 / QUESTION</text><text x="28" y="112" font-size="31" font-weight="700">A real audience</text><text x="28" y="150" font-size="31" font-weight="700">needs an answer.</text><text x="28" y="214" font-size="17">Listen to customers,</text><text x="28" y="241" font-size="17">partners and local</text><text x="28" y="268" font-size="17">organisations.</text></g>
    <g transform="translate(345 110)"><rect width="235" height="460" rx="22" fill="#244cff"/><text x="28" y="52" font-size="16" font-weight="700" letter-spacing="2" fill="#fff">02 / RESOURCE</text><text x="28" y="112" font-size="31" font-weight="700" fill="#fff">Publish the</text><text x="28" y="150" font-size="31" font-weight="700" fill="#fff">useful evidence.</text><text x="28" y="214" font-size="17" fill="#fff">A guide, checklist,</text><text x="28" y="241" font-size="17" fill="#fff">original diagram or</text><text x="28" y="268" font-size="17" fill="#fff">permissioned case note.</text><circle cx="117" cy="365" r="48" fill="#ff8659"/><path d="M91 365h52m-17-17 17 17-17 17" fill="none" stroke="#171c28" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(620 175)"><rect width="235" height="330" rx="22" fill="#fff"/><text x="28" y="52" font-size="16" font-weight="700" letter-spacing="2">03 / OUTREACH</text><text x="28" y="112" font-size="31" font-weight="700">Show the right</text><text x="28" y="150" font-size="31" font-weight="700">person why.</text><text x="28" y="214" font-size="17">One relevant note with</text><text x="28" y="241" font-size="17">a specific reader benefit.</text><text x="28" y="268" font-size="17">No demanded link.</text></g>
    <g transform="translate(895 175)"><rect width="235" height="330" rx="22" fill="#10182d"/><text x="28" y="52" font-size="16" font-weight="700" letter-spacing="2" fill="#fff">04 / REFERENCE</text><text x="28" y="112" font-size="31" font-weight="700" fill="#fff">They choose</text><text x="28" y="150" font-size="31" font-weight="700" fill="#fff">to cite it.</text><text x="28" y="214" font-size="17" fill="#fff">The publisher controls</text><text x="28" y="241" font-size="17" fill="#fff">whether and how the</text><text x="28" y="268" font-size="17" fill="#fff">reference appears.</text></g>
    <text x="70" y="630" font-size="16" letter-spacing="1.6">ORIGINAL SITESUTRA DECISION DIAGRAM · NO LINK OR RANKING OUTCOME IS PROMISED</text>
  </g>
</svg>

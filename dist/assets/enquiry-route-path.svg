<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Choose an enquiry route from the visitor's next task</title>
  <desc id="desc">A visitor task branches to WhatsApp for a quick question, a form for a structured brief, calendar booking for a ready consultation and email or phone as a fallback.</desc>
  <rect width="1200" height="680" rx="28" fill="#10182d"/>
  <g font-family="Arial, sans-serif">

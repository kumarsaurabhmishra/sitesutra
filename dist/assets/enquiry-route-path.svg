    <text x="600" y="207" fill="#5b606b" font-size="16" text-anchor="middle">Start with the decision, required context and real response workflow</text>
    <g stroke="#8ca2ff" stroke-width="5" fill="none" stroke-linecap="round"><path d="M600 238v68H197v52"/><path d="M600 238v120"/><path d="M600 306h403v52"/></g>
    <rect x="72" y="358" width="250" height="172" rx="18" fill="#ff8659"/><rect x="350" y="358" width="250" height="172" rx="18" fill="#e8edff"/><rect x="628" y="358" width="250" height="172" rx="18" fill="#fff"/><rect x="906" y="358" width="222" height="172" rx="18" fill="#244cff"/>
    <g fill="#171c28" text-anchor="middle">
      <text x="197" y="407" font-size="15" font-weight="700" letter-spacing="1">QUICK QUESTION</text><text x="197" y="455" font-size="25" font-weight="700">WHATSAPP</text><text x="197" y="487" font-size="14">Human reply in stated hours</text>
      <text x="475" y="407" font-size="15" font-weight="700" letter-spacing="1">STRUCTURED REQUEST</text><text x="475" y="455" font-size="25" font-weight="700">SHORT FORM</text><text x="475" y="487" font-size="14">Validated delivery and owner</text>
      <text x="753" y="407" font-size="15" font-weight="700" letter-spacing="1">READY TO TALK</text><text x="753" y="455" font-size="25" font-weight="700">BOOKING</text><text x="753" y="487" font-size="14">Purpose, timezone and confirmation</text>
    </g>
    <g fill="#fff" text-anchor="middle"><text x="1017" y="407" font-size="15" font-weight="700" letter-spacing="1">ALTERNATIVE</text><text x="1017" y="448" font-size="23" font-weight="700">EMAIL /</text><text x="1017" y="477" font-size="23" font-weight="700">PHONE</text><text x="1017" y="506" font-size="13">Always findable</text></g>
    <text x="72" y="614" fill="#d6d9e2" font-size="16" letter-spacing="1.4">TEST DELIVERY · STATE RESPONSE EXPECTATIONS · COUNT QUALIFIED OUTCOMES SEPARATELY</text>

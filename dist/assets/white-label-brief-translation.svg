<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">White-label development brief translation path</title>
  <desc id="desc">A five-stage path translates the client promise into approved sources, build requirements, acceptance evidence and named ownership.</desc>
  <rect width="1200" height="680" rx="36" fill="#f5f0e6"/>
  <g font-family="Manrope, sans-serif">
    <text x="72" y="82" fill="#1547ff" font-size="22" font-weight="700" letter-spacing="3">THE BRIEF TRANSLATION PATH</text>
    <text x="72" y="132" fill="#171c28" font-size="36" font-weight="700">Turn a client promise into work that can be checked.</text>
    <path d="M132 360H1058" fill="none" stroke="#1547ff" stroke-width="8" stroke-linecap="round"/>
    <path d="m1036 337 28 23-28 23" fill="none" stroke="#1547ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(72 230)">
      <rect width="190" height="260" rx="22" fill="#1547ff"/>
      <circle cx="36" cy="36" r="20" fill="#f5f0e6"/><text x="36" y="44" text-anchor="middle" fill="#1547ff" font-size="20" font-weight="700">1</text>
      <text x="24" y="96" fill="#fff" font-size="22" font-weight="700">Client promise</text>
      <text x="24" y="138" fill="#fff" font-size="16">Audience, pages,</text><text x="24" y="166" fill="#fff" font-size="16">outcome and agreed</text><text x="24" y="194" fill="#fff" font-size="16">delivery boundary.</text>
      <text x="24" y="232" fill="#fff" font-size="13" font-weight="700">AGENCY OWNED</text>
    </g>
    <g transform="translate(288 230)">
      <rect width="190" height="260" rx="22" fill="#fff" stroke="#1547ff" stroke-width="4"/>
      <circle cx="36" cy="36" r="20" fill="#1547ff"/><text x="36" y="44" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">2</text>
      <text x="24" y="96" fill="#171c28" font-size="22" font-weight="700">Approved source</text>
      <text x="24" y="138" fill="#414754" font-size="16">Design revision, copy,</text><text x="24" y="166" fill="#414754" font-size="16">assets, policies and</text><text x="24" y="194" fill="#414754" font-size="16">open questions.</text>
      <text x="24" y="232" fill="#1547ff" font-size="13" font-weight="700">VERSIONED</text>
    </g>
    <g transform="translate(504 230)">
      <rect width="190" height="260" rx="22" fill="#fff" stroke="#171c28" stroke-width="3"/>
      <circle cx="36" cy="36" r="20" fill="#171c28"/><text x="36" y="44" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">3</text>
      <text x="24" y="96" fill="#171c28" font-size="22" font-weight="700">Build rule</text>
      <text x="24" y="138" fill="#414754" font-size="16">Behaviour, states,</text><text x="24" y="166" fill="#414754" font-size="16">dependencies and</text><text x="24" y="194" fill="#414754" font-size="16">responsive intent.</text>
      <text x="24" y="232" fill="#171c28" font-size="13" font-weight="700">DELIVERY OWNED</text>
    </g>
    <g transform="translate(720 230)">
      <rect width="190" height="260" rx="22" fill="#fff" stroke="#b43a17" stroke-width="3"/>
      <circle cx="36" cy="36" r="20" fill="#b43a17"/><text x="36" y="44" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">4</text>
      <text x="24" y="96" fill="#171c28" font-size="22" font-weight="700">Acceptance</text>
      <text x="24" y="138" fill="#414754" font-size="16">Observable check,</text><text x="24" y="166" fill="#414754" font-size="16">test condition and</text><text x="24" y="194" fill="#414754" font-size="16">review evidence.</text>
      <text x="24" y="232" fill="#b43a17" font-size="13" font-weight="700">SHARED REVIEW</text>
    </g>
    <g transform="translate(936 230)">
      <rect width="192" height="260" rx="22" fill="#171c28"/>
      <circle cx="36" cy="36" r="20" fill="#f5f0e6"/><text x="36" y="44" text-anchor="middle" fill="#171c28" font-size="20" font-weight="700">5</text>
      <text x="24" y="96" fill="#fff" font-size="22" font-weight="700">Named owner</text>
      <text x="24" y="138" fill="#fff" font-size="16">One person decides,</text><text x="24" y="166" fill="#fff" font-size="16">answers or approves</text><text x="24" y="194" fill="#fff" font-size="16">the requirement.</text>
      <text x="24" y="232" fill="#fff" font-size="13" font-weight="700">ACCOUNTABLE</text>
    </g>
    <text x="72" y="580" fill="#b43a17" font-size="20" font-weight="700">If a promise has no source, check or owner, it is not ready to enter development.</text>
  </g>
</svg>

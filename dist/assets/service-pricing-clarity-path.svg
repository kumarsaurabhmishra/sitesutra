<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Four pricing clarity formats for a service website</title>
  <desc id="desc">A path moves from a fixed price for standardised services through a starting condition and example scope to a tailored quote with visible cost factors for highly variable services.</desc>
  <rect width="1200" height="680" rx="36" fill="#f5f0e6"/>
  <g font-family="Manrope, sans-serif">
    <text x="72" y="82" fill="#1547ff" font-size="22" font-weight="700" letter-spacing="3">PRICING CLARITY PATH</text>
    <text x="72" y="132" fill="#171c28" font-size="36" font-weight="700">Match the format to how predictable the service is.</text>
    <path d="M154 360H1044" fill="none" stroke="#1547ff" stroke-width="8" stroke-linecap="round"/>
    <path d="m1022 337 28 23-28 23" fill="none" stroke="#1547ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(72 220)">
      <rect width="246" height="292" rx="24" fill="#1547ff"/>
      <circle cx="42" cy="42" r="22" fill="#f5f0e6"/><text x="42" y="50" text-anchor="middle" fill="#1547ff" font-size="22" font-weight="700">1</text>
      <text x="28" y="108" fill="#fff" font-size="25" font-weight="700">Fixed price</text>
      <text x="28" y="150" fill="#fff" font-size="17">Same defined deliverable,</text><text x="28" y="180" fill="#fff" font-size="17">conditions and next step for</text><text x="28" y="210" fill="#fff" font-size="17">each suitable customer.</text>
      <text x="28" y="263" fill="#fff" font-size="14" font-weight="700">LOW SCOPE VARIATION</text>
    </g>
    <g transform="translate(342 220)">
      <rect width="246" height="292" rx="24" fill="#fff" stroke="#1547ff" stroke-width="4"/>
      <circle cx="42" cy="42" r="22" fill="#1547ff"/><text x="42" y="50" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text>
      <text x="28" y="108" fill="#171c28" font-size="25" font-weight="700">Starting condition</text>
      <text x="28" y="150" fill="#414754" font-size="17">A real minimum linked to a</text><text x="28" y="180" fill="#414754" font-size="17">named scope, not a teaser</text><text x="28" y="210" fill="#414754" font-size="17">that no project can meet.</text>
      <text x="28" y="263" fill="#1547ff" font-size="14" font-weight="700">SOME VARIABLES</text>
    </g>
    <g transform="translate(612 220)">
      <rect width="246" height="292" rx="24" fill="#fff" stroke="#171c28" stroke-width="3"/>
      <circle cx="42" cy="42" r="22" fill="#171c28"/><text x="42" y="50" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text>
      <text x="28" y="108" fill="#171c28" font-size="25" font-weight="700">Example scope</text>
      <text x="28" y="150" fill="#414754" font-size="17">A labelled scenario shows</text><text x="28" y="180" fill="#414754" font-size="17">what is included and which</text><text x="28" y="210" fill="#414754" font-size="17">changes alter the quote.</text>
      <text x="28" y="263" fill="#171c28" font-size="14" font-weight="700">SEVERAL VARIABLES</text>
    </g>
    <g transform="translate(882 220)">
      <rect width="246" height="292" rx="24" fill="#171c28"/>
      <circle cx="42" cy="42" r="22" fill="#f5f0e6"/><text x="42" y="50" text-anchor="middle" fill="#171c28" font-size="22" font-weight="700">4</text>
      <text x="28" y="108" fill="#fff" font-size="25" font-weight="700">Tailored quote</text>
      <text x="28" y="150" fill="#fff" font-size="17">Explain the inputs, process</text><text x="28" y="180" fill="#fff" font-size="17">and response before asking</text><text x="28" y="210" fill="#fff" font-size="17">the visitor to enquire.</text>
      <text x="28" y="263" fill="#fff" font-size="14" font-weight="700">HIGH SCOPE VARIATION</text>
    </g>
    <text x="72" y="590" fill="#b43a17" font-size="20" font-weight="700">Every format still needs inclusions, exclusions, conditions and a clear next action.</text>
  </g>
</svg>

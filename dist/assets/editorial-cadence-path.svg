<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Editorial cadence follows buyer decisions rather than a fixed posting frequency</title>
  <desc id="desc">A path connects a buyer question to a distinct decision, original evidence, publication and a later review, with side routes to update, consolidate or skip.</desc>
  <rect width="1200" height="680" rx="28" fill="#10182d"/>
  <g font-family="Arial, sans-serif">
    <text x="72" y="72" fill="#fff" font-size="18" font-weight="700" letter-spacing="2">A SUSTAINABLE EDITORIAL CADENCE</text>
    <path d="M105 280h930" stroke="#8ca2ff" stroke-width="8" stroke-linecap="round"/>
    <g fill="#f7f5ef" stroke="#244cff" stroke-width="4">
      <circle cx="115" cy="280" r="68"/><circle cx="350" cy="280" r="68"/><circle cx="585" cy="280" r="68"/><circle cx="820" cy="280" r="68"/><circle cx="1055" cy="280" r="68"/>
    </g>
    <g fill="#171c28" font-size="17" text-anchor="middle" font-weight="700">
      <text x="115" y="270"><tspan x="115">BUYER</tspan><tspan x="115" dy="23">QUESTION</tspan></text>
      <text x="350" y="270"><tspan x="350">DISTINCT</tspan><tspan x="350" dy="23">DECISION</tspan></text>
      <text x="585" y="270"><tspan x="585">REAL</tspan><tspan x="585" dy="23">EVIDENCE</tspan></text>
      <text x="820" y="270"><tspan x="820">PUBLISH &amp;</tspan><tspan x="820" dy="23">DISTRIBUTE</tspan></text>
      <text x="1055" y="270"><tspan x="1055">REVIEW &amp;</tspan><tspan x="1055" dy="23">MAINTAIN</tspan></text>
    </g>
    <path d="M350 365v90M585 365v90M820 365v90" stroke="#ff8659" stroke-width="5" stroke-linecap="round"/>
    <g font-size="18" font-weight="700" text-anchor="middle">
      <rect x="240" y="455" width="220" height="74" rx="14" fill="#ff8659"/><text x="350" y="500" fill="#171c28">CONSOLIDATE</text>
      <rect x="475" y="455" width="220" height="74" rx="14" fill="#e8edff"/><text x="585" y="500" fill="#171c28">UPDATE</text>
      <rect x="710" y="455" width="220" height="74" rx="14" fill="#fff"/><text x="820" y="500" fill="#171c28">SKIP THIS SLOT</text>
    </g>
    <text x="72" y="615" fill="#d6d9e2" font-size="16" letter-spacing="1.5">PUBLISH WHEN THE PAGE EARNS ITS PLACE · NO FREQUENCY OR RANKING OUTCOME IS PROMISED</text>
  </g>
</svg>

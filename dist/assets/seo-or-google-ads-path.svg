<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">SEO or Google Ads decision path</title>
  <desc id="desc">A five stage path checks offer, destination, response and measurement before choosing an SEO foundation, a controlled ads test or both in sequence.</desc>
  <rect width="1200" height="680" rx="24" fill="#f4f0e6"/>
  <text x="72" y="82" fill="#171c28" font-family="Manrope, sans-serif" font-size="38" font-weight="700">Choose the next useful search channel</text>
  <text x="72" y="122" fill="#596173" font-family="Manrope, sans-serif" font-size="20">Readiness first. One measured decision next.</text>
  <g font-family="Manrope, sans-serif">
    <rect x="72" y="190" width="184" height="142" rx="16" fill="#ffffff" stroke="#c9c4b8" stroke-width="2"/>
    <circle cx="108" cy="226" r="17" fill="#244cff"/><text x="108" y="233" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">1</text>
    <text x="96" y="275" fill="#171c28" font-size="23" font-weight="700">Define</text><text x="96" y="307" fill="#596173" font-size="17">One offer and area</text>
    <path d="M270 261h44" stroke="#244cff" stroke-width="4" stroke-linecap="round"/><path d="m302 250 12 11-12 11" fill="none" stroke="#244cff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="328" y="190" width="184" height="142" rx="16" fill="#ffffff" stroke="#c9c4b8" stroke-width="2"/>
    <circle cx="364" cy="226" r="17" fill="#244cff"/><text x="364" y="233" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">2</text>
    <text x="352" y="275" fill="#171c28" font-size="23" font-weight="700">Prepare</text><text x="352" y="307" fill="#596173" font-size="17">Page and action</text>
    <path d="M526 261h44" stroke="#244cff" stroke-width="4" stroke-linecap="round"/><path d="m558 250 12 11-12 11" fill="none" stroke="#244cff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="584" y="190" width="184" height="142" rx="16" fill="#ffffff" stroke="#c9c4b8" stroke-width="2"/>
    <circle cx="620" cy="226" r="17" fill="#244cff"/><text x="620" y="233" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">3</text>
    <text x="608" y="275" fill="#171c28" font-size="23" font-weight="700">Assign</text><text x="608" y="307" fill="#596173" font-size="17">Response capacity</text>
    <path d="M782 261h44" stroke="#244cff" stroke-width="4" stroke-linecap="round"/><path d="m814 250 12 11-12 11" fill="none" stroke="#244cff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="840" y="190" width="184" height="142" rx="16" fill="#ffffff" stroke="#c9c4b8" stroke-width="2"/>
    <circle cx="876" cy="226" r="17" fill="#244cff"/><text x="876" y="233" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">4</text>
    <text x="864" y="275" fill="#171c28" font-size="23" font-weight="700">Measure</text><text x="864" y="307" fill="#596173" font-size="17">Real enquiry outcome</text>
    <path d="M932 350v52" stroke="#244cff" stroke-width="4" stroke-linecap="round"/><path d="m921 390 11 12 11-12" fill="none" stroke="#244cff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="144" y="430" width="282" height="150" rx="18" fill="#171c28"/>
    <text x="174" y="478" fill="#ff694f" font-size="17" font-weight="700">DURABLE QUESTIONS</text><text x="174" y="521" fill="#fff" font-size="27" font-weight="700">SEO foundation</text><text x="174" y="551" fill="#cfd5e2" font-size="17">Useful pages with owners</text>
    <rect x="459" y="430" width="282" height="150" rx="18" fill="#244cff"/>
    <text x="489" y="478" fill="#fff" font-size="17" font-weight="700">TIME SENSITIVE TEST</text><text x="489" y="521" fill="#fff" font-size="27" font-weight="700">Google Ads</text><text x="489" y="551" fill="#e2e7ff" font-size="17">Controlled scope and budget</text>
    <rect x="774" y="430" width="282" height="150" rx="18" fill="#ffffff" stroke="#ff694f" stroke-width="3"/>
    <text x="804" y="478" fill="#ad2f1b" font-size="17" font-weight="700">AFTER REVIEW</text><text x="804" y="521" fill="#171c28" font-size="27" font-weight="700">Add the next channel</text><text x="804" y="551" fill="#596173" font-size="17">Keep evidence separate</text>

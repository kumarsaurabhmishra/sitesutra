<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Three gates before an agency sends a staging website to its client</title>
  <desc id="desc">A path moves through brief match, visitor task and release hygiene gates, then reaches client review. Blockers return to the delivery loop.</desc>
  <rect width="1200" height="680" rx="36" fill="#f5f0e6"/>
  <path d="M122 348H1030" fill="none" stroke="#1547ff" stroke-width="8" stroke-linecap="round"/>
  <path d="m1012 326 28 22-28 22" fill="none" stroke="#1547ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, sans-serif">
    <text x="72" y="84" fill="#1547ff" font-size="22" font-weight="700" letter-spacing="3">AGENCY STAGING REVIEW</text>
    <text x="72" y="132" fill="#161616" font-size="36" font-weight="700">Three gates before the client link</text>
    <g transform="translate(100 220)"><rect width="270" height="250" rx="24" fill="#1547ff"/><circle cx="48" cy="48" r="24" fill="#f5f0e6"/><text x="48" y="57" text-anchor="middle" fill="#1547ff" font-size="24" font-weight="700">1</text><text x="32" y="112" fill="#fff" font-size="28" font-weight="700">Brief match</text><text x="32" y="150" fill="#fff" font-size="19">Approved pages, content,</text><text x="32" y="180" fill="#fff" font-size="19">brand and scope are present.</text><text x="32" y="222" fill="#fff" font-size="16" font-weight="700">DID WE BUILD IT?</text></g>
    <g transform="translate(465 220)"><rect width="270" height="250" rx="24" fill="#fff" stroke="#1547ff" stroke-width="4"/><circle cx="48" cy="48" r="24" fill="#1547ff"/><text x="48" y="57" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">2</text><text x="32" y="112" fill="#161616" font-size="28" font-weight="700">Visitor task</text><text x="32" y="150" fill="#363636" font-size="19">Navigation, forms and key</text><text x="32" y="180" fill="#363636" font-size="19">actions work on real devices.</text><text x="32" y="222" fill="#1547ff" font-size="16" font-weight="700">CAN THEY USE IT?</text></g>
    <g transform="translate(830 220)"><rect width="270" height="250" rx="24" fill="#161616"/><circle cx="48" cy="48" r="24" fill="#f5f0e6"/><text x="48" y="57" text-anchor="middle" fill="#161616" font-size="24" font-weight="700">3</text><text x="32" y="112" fill="#fff" font-size="28" font-weight="700">Release hygiene</text><text x="32" y="150" fill="#fff" font-size="19">Ownership, metadata and the</text><text x="32" y="180" fill="#fff" font-size="19">launch plan are documented.</text><text x="32" y="222" fill="#fff" font-size="16" font-weight="700">CAN IT SHIP SAFELY?</text></g>
    <path d="M600 502v66H250" fill="none" stroke="#e7582e" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 12"/><path d="m270 548-24 20 24 20" fill="none" stroke="#e7582e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="410" y="616" fill="#b43a17" font-size="19" font-weight="700">BLOCKER → RETURN TO THE DELIVERY LOOP</text>
  </g>
</svg>

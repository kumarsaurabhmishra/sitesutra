<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Website content ownership flow from business facts to approved page</title>
  <desc id="desc">Four connected stages show the business supplying facts, a writer shaping the message, the website team placing content in the interface and the business approving the final page.</desc>
  <rect width="1200" height="680" rx="36" fill="#f5f0e6"/>
  <g font-family="Manrope, sans-serif">
    <text x="72" y="82" fill="#1547ff" font-size="22" font-weight="700" letter-spacing="3">CONTENT RESPONSIBILITY FLOW</text>
    <text x="72" y="132" fill="#171c28" font-size="36" font-weight="700">Facts stay with the business. Production is shared.</text>
    <path d="M156 362H1020" fill="none" stroke="#1547ff" stroke-width="7" stroke-linecap="round"/>
    <path d="m1000 340 28 22-28 22" fill="none" stroke="#1547ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(72 220)">
      <rect width="240" height="280" rx="24" fill="#1547ff"/>
      <circle cx="42" cy="42" r="22" fill="#f5f0e6"/><text x="42" y="50" text-anchor="middle" fill="#1547ff" font-size="22" font-weight="700">1</text>
      <text x="28" y="108" fill="#fff" font-size="26" font-weight="700">Business facts</text>
      <text x="28" y="148" fill="#fff" font-size="18">Services, process, proof,</text><text x="28" y="178" fill="#fff" font-size="18">boundaries and customer</text><text x="28" y="208" fill="#fff" font-size="18">questions come from the owner.</text>
      <text x="28" y="252" fill="#fff" font-size="15" font-weight="700">OWNER: BUSINESS</text>
    </g>
    <g transform="translate(360 220)">
      <rect width="240" height="280" rx="24" fill="#fff" stroke="#1547ff" stroke-width="4"/>
      <circle cx="42" cy="42" r="22" fill="#1547ff"/><text x="42" y="50" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text>
      <text x="28" y="108" fill="#171c28" font-size="26" font-weight="700">Useful draft</text>
      <text x="28" y="148" fill="#414754" font-size="18">A writer turns evidence into</text><text x="28" y="178" fill="#414754" font-size="18">clear page sections and</text><text x="28" y="208" fill="#414754" font-size="18">specific next steps.</text>
      <text x="28" y="252" fill="#1547ff" font-size="15" font-weight="700">OWNER: NAMED WRITER</text>
    </g>
    <g transform="translate(648 220)">
      <rect width="240" height="280" rx="24" fill="#fff" stroke="#171c28" stroke-width="3"/>
      <circle cx="42" cy="42" r="22" fill="#171c28"/><text x="42" y="50" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text>
      <text x="28" y="108" fill="#171c28" font-size="26" font-weight="700">Page build</text>
      <text x="28" y="148" fill="#414754" font-size="18">The website team maps copy</text><text x="28" y="178" fill="#414754" font-size="18">to headings, controls, forms</text><text x="28" y="208" fill="#414754" font-size="18">and responsive layouts.</text>
      <text x="28" y="252" fill="#171c28" font-size="15" font-weight="700">OWNER: WEBSITE TEAM</text>
    </g>
    <g transform="translate(936 220)">
      <rect width="192" height="280" rx="24" fill="#171c28"/>
      <circle cx="42" cy="42" r="22" fill="#f5f0e6"/><text x="42" y="50" text-anchor="middle" fill="#171c28" font-size="22" font-weight="700">4</text>
      <text x="28" y="108" fill="#fff" font-size="26" font-weight="700">Approval</text>
      <text x="28" y="148" fill="#fff" font-size="18">Accuracy, permissions</text><text x="28" y="178" fill="#fff" font-size="18">and response details</text><text x="28" y="208" fill="#fff" font-size="18">are confirmed.</text>
      <text x="28" y="252" fill="#fff" font-size="15" font-weight="700">OWNER: BUSINESS</text>
    </g>
    <text x="72" y="584" fill="#b43a17" font-size="20" font-weight="700">If a fact has no source or approver, mark it unresolved rather than filling the gap.</text>
  </g>
</svg>
